[project]
name = "docflow"
version = "0.1.0"
description = "DocFlow AI — turn documents into decisions, deadlines, tasks and actions"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # data
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    # auth
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    # jobs / cache
    "arq>=0.26",
    "redis>=5.2",
    # storage
    "boto3>=1.35",
    # documents
    "pymupdf>=1.24",
    "pillow>=11.0",
    "filetype>=1.2",
    "pytesseract>=0.3.13",
    # ai / text
    "anthropic>=0.40",
    "openai>=1.55",
    "rapidfuzz>=3.10",
    "dateparser>=1.2",
    "tiktoken>=0.8",
    # ops
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-dateparser",
]

[project.scripts]
docflow-eval = "docflow.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert — used throughout tests
    "B008",  # FastAPI Depends() in defaults is the documented pattern
    "N818",  # our exception names are intentional
]

[tool.ruff.lint.per-file-ignores]
# S608 flags f-string SQL. In tests and the RLS migration the interpolated values
# are table names from our own metadata/constants, never request data. The real
# rule — no user input in an f-string query — is enforced everywhere else.
"tests/**" = ["S105", "S106", "S311", "S608", "E501"]
"src/docflow/db/migrations/**" = ["E501", "I001", "S608"]
# This module exists to normalise confusable Unicode, so RUF001/003 fire on every
# entry in its own lookup tables.
"src/docflow/ai/normalization/text.py" = ["RUF001", "RUF002", "RUF003"]
"src/docflow/ai/normalization/bangla.py" = ["RUF001", "RUF002", "RUF003"]
# type_annotation_map is SQLAlchemy's documented API and is genuinely a dict.
"src/docflow/core/database.py" = ["RUF012"]
# ASYNC109: `timeout` is part of the provider protocol and is forwarded to the
# vendor SDK, which enforces it properly. Wrapping in asyncio.timeout on top
# would double-cancel and lose the SDK's own retry/telemetry behaviour.
"src/docflow/ai/llm/*.py" = ["ASYNC109", "RUF001", "RUF002", "RUF003"]
# ARQ reads these as class attributes on WorkerSettings; they are its API.
"src/docflow/worker/main.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# strict where correctness is load-bearing (docs/50-security-ops.md §24.4)
module = ["docflow.ai.*", "docflow.services.*", "docflow.core.*"]
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs postgres + redis",
    "eval: calls real LLM providers, costs money",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/docflow"]
omit = ["*/migrations/*", "*/__main__.py"]
